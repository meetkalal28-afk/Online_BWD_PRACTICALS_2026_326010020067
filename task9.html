
<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Canvas and SVG</title>
</head>
<body>

    <h1>HTML5 Canvas and SVG Graphics</h1>

    <h2>Canvas Shapes</h2>

    <canvas id="myCanvas" width="500" height="350"
            style="border:1px solid black;">

    </canvas>

    <script>
        var canvas = document.getElementById("myCanvas");
        var ctx = canvas.getContext("2d");

        // Draw Rectangle
        ctx.fillStyle = "blue";
        ctx.fillRect(30, 30, 120, 70);

        // Draw Circle
        ctx.beginPath();
        ctx.arc(230, 65, 40, 0, 2 * Math.PI);
        ctx.fillStyle = "green";
        ctx.fill();

        // Draw Line
        ctx.beginPath();
        ctx.moveTo(30, 160);
        ctx.lineTo(200, 160);
        ctx.strokeStyle = "red";
        ctx.lineWidth = 4;
        ctx.stroke();

        // Draw Text
        ctx.font = "25px Arial";
        ctx.fillStyle = "black";
        ctx.fillText("Welcome to College", 30, 230);

    </script>

    <hr>

    <h2>College Logo Using SVG</h2>

    <svg width="200" height="200">

        <circle cx="100" cy="100" r="85"
                fill="lightblue" stroke="blue"
                stroke-width="4"/>

        <rect x="65" y="65" width="70" height="70"
              fill="white" stroke="blue"
              stroke-width="3"/>

        <text x="100" y="110"
              font-size="18"
              text-anchor="middle"
              fill="blue">
            MU
        </text>

        <text x="100" y="165"
              font-size="12"
              text-anchor="middle"
              fill="black">
            COLLEGE
        </text>

    </svg>

</body>
</html>
